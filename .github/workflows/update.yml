name: Actualizar catálogo

on:
  schedule:
    # todos los días a las 06:23 UTC (≈ 03:23 en Chile)
    - cron: "23 6 * * *"
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    paths:
      - "stores.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar productos de las tiendas
        run: python scripts/update.py
      - name: Guardar cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización diaria del catálogo"
            git push
          fi
