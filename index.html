<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Streetwear CL</title>
<meta name="description" content="Catálogo de prendas de marcas chilenas de streetwear: precios, ofertas y tallas, actualizado a diario.">
<meta name="theme-color" content="#f3f3f1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Estilo: achromatic-ledger (tasteskill, seed 1896206645), shell sin sidebar.
   Cara: suelo "asfalto" (#f3f3f1) en vez de #f8f8f8; el único tono (#1d5fbf) va en el dato principal: el precio rebajado.
   Grilla: columna centrada de 1208px máx. Tarjetas: repeat(auto-fill, minmax(212px,1fr)) con gap 12px;
   a 1208px → 5 × 231.2 + 4 × 12 = 1204 (+4 de holgura) → las tarjetas tocan ambos bordes de la columna. */
:root{
  --ground:#f3f3f1; --surface:#ffffff; --raised:#ebebe8; --active:#e8e8e5;
  --border:#e3e3e0; --rule:#ecece9; --control:#d1d1cd;
  --text:#0a0a0a; --muted:#5f5f5c; --faint:#6b6b68;
  --primary:#141414; --hue:#1d5fbf;
  --pill-neutral-bg:#e8e8e5; --pill-neutral-ink:#3d3d3a;
  --negative:#c4242a;
  --radius-card:8px; --radius-control:6px;
  --gap:12px; --pad:24px; --control-height:36px;
  --fs-title:24px; --fs-section:16px; --fs-body:14px; --fs-small:12px;
  --font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font:400 var(--fs-body)/20px var(--font);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
[hidden]{display:none!important}

.col{max-width:1208px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (min-width:1257px){.col{padding-left:0;padding-right:0}}

/* barra superior en el mismo suelo */
.top{position:sticky;top:0;z-index:20;background:var(--ground);transition:box-shadow .15s}
.top.scrolled{box-shadow:0 1px 0 var(--border)} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.top .col{height:48px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;color:var(--muted);font-weight:500;padding:6px 10px;border-radius:var(--radius-control)}
.nav a[aria-current="page"]{color:var(--text);background:var(--active)}
.nav a:hover{color:var(--text)}
.stamp{margin-left:auto;color:var(--muted);font-size:var(--fs-small);white-space:nowrap}

/* fila de título */
.head{padding-top:28px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{margin:0;font-size:var(--fs-title);line-height:30px;font-weight:700;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:22px;max-width:86ch}
.sub b{color:var(--text);font-weight:500}

/* pestañas subrayadas */
.tabs{display:flex;gap:24px;margin-top:20px;box-shadow:inset 0 -1px 0 var(--border);overflow-x:auto;scrollbar-width:none} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;padding:10px 0 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.tab .c{color:var(--faint);font-weight:400;margin-left:6px}
.tab[aria-selected="true"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.tab:hover{color:var(--text)}

/* barra de herramientas */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px}
.search{position:relative;flex:0 1 300px;min-width:200px}
.search svg{position:absolute;left:11px;top:11px;color:var(--faint)}
.search input{width:100%;height:var(--control-height);padding:0 12px 0 34px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface)}
.search input::placeholder{color:var(--faint)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.dd{position:relative}
.ctl{height:var(--control-height);display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500}
.ctl:hover{border-color:#a9a9a5}
.ctl[aria-expanded="true"]{border-color:var(--text)}
.ctl .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;line-height:18px;text-align:center}
.ctl .n:empty{display:none}
.ctl svg{color:var(--faint)}
.ctl.on{background:var(--active);border-color:var(--text)}
.ctl .tick{display:none}
.ctl.on .tick{display:block;color:var(--text)}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted)}
.right select{height:var(--control-height);border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);padding:0 8px;color:var(--text)}

/* menús desplegables (flotan: llevan sombra) */
.panel{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:288px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.panel input[type=search],.panel input[type=number]{width:100%;height:34px;padding:0 10px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface)}
.panel input[type=search]{margin-bottom:6px}
.opts{max-height:320px;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border-radius:var(--radius-control);cursor:pointer}
.opt:hover{background:var(--ground)}
.opt input{accent-color:var(--primary);width:16px;height:16px;margin:0}
.opt .c{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.zero{color:var(--faint)}
.sizes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px}
.sizes-grid label{position:relative;display:flex;align-items:center;justify-content:center;height:36px;border:1px solid var(--control);border-radius:var(--radius-control);cursor:pointer;font-weight:500}
.sizes-grid input{position:absolute;opacity:0;pointer-events:none}
.sizes-grid label:has(input:checked){background:var(--primary);border-color:var(--primary);color:#fff}
.sizes-grid label:has(input:focus-visible){outline:2px solid var(--hue);outline-offset:2px}
.sw{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.prow{display:flex;gap:8px;padding:4px}
.presets{display:flex;flex-wrap:wrap;gap:6px;padding:6px 4px}
.presets button{height:30px;padding:0 10px;border:1px solid var(--control);border-radius:15px;background:var(--surface);cursor:pointer}
.presets button:hover{border-color:var(--text)}
.pfoot{display:flex;justify-content:space-between;padding:8px 4px 2px;margin-top:6px;box-shadow:inset 0 1px 0 var(--rule)} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.link{background:none;border:0;padding:4px;cursor:pointer;color:var(--text);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--muted)}

/* filtros activos */
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.active:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:14px;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink);border:0;cursor:pointer;font-size:13px}
.chip:hover{background:#dededa}
.chip span{color:var(--muted)}

/* grilla de prendas */
.meta{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:var(--gap)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
.card:hover{border-color:#c9c9c5}
.pic{position:relative;display:block;aspect-ratio:4/5;background:var(--raised);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.card:hover .pic img{transform:scale(1.03)}
.pic .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px}
.flag{position:absolute;top:8px;left:8px;display:flex;gap:4px}
.pill{height:22px;padding:0 8px;border-radius:4px;font-size:12px;line-height:22px;font-weight:500;background:var(--surface);color:var(--text);white-space:nowrap}
.pill.out{background:var(--pill-neutral-bg);color:var(--pill-neutral-ink)}
.body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.by{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-small);line-height:16px;color:var(--muted)}
.by a{text-decoration:none}
.by a:hover{text-decoration:underline}
.title{font-weight:500;line-height:20px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;min-height:40px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;margin-top:2px;font-variant-numeric:tabular-nums}
.price b{font-size:16px;font-weight:700}
.price.sale b{color:var(--hue)}
.price s{color:var(--muted);font-size:13px}
.price .off{color:var(--hue);font-size:13px;font-weight:500}
.sizes{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sizes span{height:22px;min-width:26px;padding:0 6px;border-radius:4px;background:var(--ground);font-size:12px;line-height:22px;text-align:center;color:var(--muted)}
.sizes .none{background:none;padding:0;color:var(--faint)}
.go{margin-top:auto;padding-top:10px}
.go a{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:var(--radius-control);background:var(--surface);color:var(--text);border:1px solid var(--control);text-decoration:none;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.go a:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.go .short{display:none}
.go a:active{transform:translateY(1px)}
.more{display:block;margin:24px auto 0;height:var(--control-height);padding:0 18px;border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);cursor:pointer;font-weight:500}
.empty{grid-column:1/-1;border:1px dashed var(--control);border-radius:var(--radius-card);padding:28px;text-align:center;color:var(--muted)}
.skel .pic{background:var(--raised)}
.skel .bar{height:14px;border-radius:4px;background:var(--raised)}

/* vista de tiendas */
.table{width:100%;border-collapse:collapse;margin-top:20px;font-variant-numeric:tabular-nums}
.table th{font-size:var(--fs-small);font-weight:400;color:var(--muted);text-align:left;padding:0 12px 10px 0;white-space:nowrap}
.table td{padding:0 12px 0 0;height:48px;box-shadow:inset 0 -1px 0 var(--rule);white-space:nowrap} /* taste-skill-ignore: línea de 1px dibujada con box-shadow (regla, indicador de pestaña o panel flotante) */
.table .r{text-align:right}
.table td.name{width:40%}
.table td.name button{background:none;border:0;padding:0;cursor:pointer;font-weight:500;text-align:left}
.table td.name button:hover{text-decoration:underline;text-underline-offset:3px}
.table .zero{color:var(--faint)}
.table a{color:var(--text);font-weight:500;text-underline-offset:3px}
.table .dash{color:var(--faint)}
.foot{margin:48px 0 32px;color:var(--muted);font-size:var(--fs-small)}

@media (max-width:760px){
  .col{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stamp{display:none}
  .nav{margin-left:auto}
  .head{padding-top:20px}
  .sub{font-size:14px;line-height:20px}
  .tools{gap:8px}
  .search{flex:1 1 100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .right{margin-left:0;width:100%;justify-content:space-between}
  .dd{position:static}
  .panel{left:16px;right:16px;width:auto;max-width:none;top:auto;margin-top:6px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .body{padding:10px}
  .by a{display:none}
  .go .long{display:none}
  .go .short{display:inline}
  .table th.opt-col,.table td.opt-col{display:none}
  .table td.name{width:auto;white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover .pic img{transform:none}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="col">
    <a class="brand" href="#" aria-label="Radar Streetwear CL, inicio">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L18.2 5.4" stroke="#1d5fbf" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="1.6" fill="currentColor"/></svg>
      Radar Streetwear CL
    </a>
    <nav class="nav" aria-label="Secciones">
      <a href="#" data-view="catalog">Catálogo</a>
      <a href="#tiendas" data-view="stores">Tiendas</a>
    </nav>
    <span class="stamp num" id="stamp"></span>
  </div>
</header>

<main class="col">
  <section id="v-catalog">
    <div class="head">
      <div>
        <h1>Catálogo</h1>
        <p class="sub num" id="finding">Cargando las prendas de todas las tiendas…</p>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Qué prendas mostrar">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">Todo<span class="c num" id="c-all"></span></button>
      <button class="tab" role="tab" data-tab="sale" aria-selected="false">En oferta<span class="c num" id="c-sale"></span></button>
      <button class="tab" role="tab" data-tab="new" aria-selected="false">Nuevos, últimos 14 días<span class="c num" id="c-new"></span></button>
    </div>

    <div class="tools">
      <label class="search"><span hidden>Buscar</span>
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Buscar: hoodie, cargo, negro…" autocomplete="off">
      </label>
      <div class="filters" id="filters">
        <div class="dd" data-key="brand"><button class="ctl" type="button" aria-expanded="false">Marca <span class="n num"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
        <div class="dd" data-key="cat"><button class="ctl" type="button" aria-expanded="false">Tipo <span class="n num"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
        <div class="dd" data-key="size"><button class="ctl" type="button" aria-expanded="false">Talla <span class="n num"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
        <div class="dd" data-key="color"><button class="ctl" type="button" aria-expanded="false">Color <span class="n num"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
        <div class="dd" data-key="price"><button class="ctl" type="button" aria-expanded="false">Precio <span class="n num"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
        <button class="ctl" type="button" id="tStock" aria-pressed="true"><svg class="tick" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="currentColor" stroke-width="1.75"/></svg>Solo con stock</button>
      </div>
      <div class="right">
        <span class="num" id="count"></span>
        <label><span hidden>Ordenar</span>
          <select id="sort">
            <option value="rel">Más recientes</option>
            <option value="asc">Precio: menor a mayor</option>
            <option value="desc">Precio: mayor a menor</option>
            <option value="disc">Mayor descuento</option>
          </select>
        </label>
      </div>
    </div>
    <div class="active" id="active"></div>

    <div class="grid" id="grid" style="margin-top:20px" aria-live="polite"></div>
    <button class="more num" id="more" type="button" hidden></button>
  </section>

  <section id="v-stores" hidden>
    <div class="head">
      <div>
        <h1>Tiendas</h1>
        <p class="sub num" id="stores-sub"></p>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="table" id="stores-table">
        <thead><tr><th>Marca</th><th class="r">Prendas</th><th class="r opt-col">Con stock</th><th class="r">En oferta</th><th>Tienda</th><th class="opt-col">Instagram</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <p class="foot">Precios y stock tomados de la web pública de cada tienda; la compra se hace siempre en la tienda original.</p>
</main>

<script>
const COLORS={"Negro":"#1a1a1a","Blanco/Crema":"#f3efe6","Gris":"#9a9ca1","Azul":"#2f5fa8","Rojo/Burdeo":"#8e2333","Rosado":"#e89ab5","Verde":"#5d7a3e","Café/Beige":"#8a6a4a","Amarillo":"#e7c43c","Naranjo":"#e3792f","Morado":"#7a4fa0","Camuflado":"#6b6b47"};
const SIZE_ORDER=["XS","S","M","L","XL","XXL","XXXL","Única"];
const LABELS={brand:"Marca",cat:"Tipo",size:"Talla",color:"Color"};
const PAGE=48, NEW_DAYS=14;
const fmt=n=>"$"+Math.round(n).toLocaleString("es-CL");
const int=n=>n.toLocaleString("es-CL");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normTxt=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const $=id=>document.getElementById(id);

let DATA={items:[],stores:[]}, STORES={}, shown=PAGE, openKey=null;
const state={q:"",tab:"all",stock:true,brand:new Set(),cat:new Set(),size:new Set(),color:new Set(),pMin:null,pMax:null,sort:"rel"};
const isNew=i=>i.published&&(Date.now()-new Date(i.published).getTime())<NEW_DAYS*864e5;
const onSale=i=>i.compare_at>i.price;

function save(){try{localStorage.setItem("radar-f3",JSON.stringify({...state,brand:[...state.brand],cat:[...state.cat],size:[...state.size],color:[...state.color]}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("radar-f3")||"null");if(s)Object.assign(state,s,{brand:new Set(s.brand),cat:new Set(s.cat),size:new Set(s.size),color:new Set(s.color)})}catch(e){}}

function matches(i,skip){
  if(state.tab==="sale"&&!onSale(i))return false;
  if(state.tab==="new"&&!isNew(i))return false;
  if(state.stock&&!i.available)return false;
  if(skip!=="brand"&&state.brand.size&&!state.brand.has(i.brand))return false;
  if(skip!=="cat"&&state.cat.size&&!state.cat.has(i.cat))return false;
  if(skip!=="color"&&state.color.size&&!i.colors.some(c=>state.color.has(c)))return false;
  if(skip!=="size"&&state.size.size&&!i.sizes.some(s=>state.size.has(s)))return false;
  if(state.pMin!=null&&i.price<state.pMin)return false;
  if(state.pMax!=null&&i.price>state.pMax)return false;
  if(state.q){const w=normTxt(state.q).split(/\s+/).filter(Boolean);if(!w.every(x=>i.search.includes(x)))return false}
  return true;
}
const valsOf=(i,k)=>k==="brand"?[i.brand]:k==="cat"?[i.cat]:k==="size"?i.sizes:i.colors;
function counts(key){const m=new Map();DATA.items.forEach(i=>{if(matches(i,key))valsOf(i,key).forEach(v=>m.set(v,(m.get(v)||0)+1))});return m}
function allValues(key){
  const s=new Set();DATA.items.forEach(i=>valsOf(i,key).forEach(v=>s.add(v)));let v=[...s];
  if(key==="size")v.sort((a,b)=>{const x=SIZE_ORDER.indexOf(a),y=SIZE_ORDER.indexOf(b);if(x>-1&&y>-1)return x-y;if(x>-1)return -1;if(y>-1)return 1;return a.localeCompare(b,"es",{numeric:true})});
  else if(key==="color")v=Object.keys(COLORS).filter(c=>s.has(c));
  else v.sort((a,b)=>a.localeCompare(b,"es"));
  return v;
}

function panelHTML(key){
  const foot=`<div class="pfoot"><button class="link quiet" type="button" data-clear>Quitar</button><button class="link" type="button" data-close>Listo</button></div>`;
  if(key==="price")return `<div class="prow"><input type="number" id="pMin" placeholder="Mínimo" min="0" step="1000" inputmode="numeric" value="${state.pMin??""}" aria-label="Precio mínimo"><input type="number" id="pMax" placeholder="Máximo" min="0" step="1000" inputmode="numeric" value="${state.pMax??""}" aria-label="Precio máximo"></div>
    <div class="presets"><button type="button" data-p="0-20000">Hasta $20.000</button><button type="button" data-p="20000-40000">$20.000 a $40.000</button><button type="button" data-p="40000-60000">$40.000 a $60.000</button><button type="button" data-p="60000-">Más de $60.000</button></div>${foot}`;
  const c=counts(key), vals=allValues(key);
  if(key==="size")return `<div class="sizes-grid">${vals.map(v=>`<label title="${esc(v)}: ${c.get(v)||0} prendas"><input type="checkbox" value="${esc(v)}" ${state.size.has(v)?"checked":""}>${esc(v)}</label>`).join("")}</div>${foot}`;
  const opts=vals.map(v=>{const n=c.get(v)||0;const sw=key==="color"?`<span class="sw" style="background:${COLORS[v]}"></span>`:"";
    return `<label class="opt${n?"":" zero"}" data-v="${esc(normTxt(v))}"><input type="checkbox" value="${esc(v)}" ${state[key].has(v)?"checked":""}>${sw}<span>${esc(v)}</span><span class="c">${int(n)}</span></label>`}).join("");
  const find=key==="brand"?`<input type="search" placeholder="Buscar entre ${vals.length} marcas" data-find aria-label="Buscar marca">`:"";
  return `${find}<div class="opts">${opts}</div>${foot}`;
}
function closePanel(){document.querySelectorAll(".panel").forEach(p=>p.remove());document.querySelectorAll(".dd .ctl").forEach(b=>b.setAttribute("aria-expanded","false"));openKey=null}
function openPanel(dd){
  const key=dd.dataset.key, was=openKey===key; closePanel(); if(was)return;
  openKey=key; dd.querySelector(".ctl").setAttribute("aria-expanded","true");
  const p=document.createElement("div");p.className="panel";p.innerHTML=panelHTML(key);dd.appendChild(p);
  p.addEventListener("click",e=>e.stopPropagation());
  p.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{cb.checked?state[key].add(cb.value):state[key].delete(cb.value);update()});
  const f=p.querySelector("[data-find]");if(f){f.focus();f.oninput=()=>{const t=normTxt(f.value);p.querySelectorAll(".opt").forEach(l=>l.hidden=!l.dataset.v.includes(t))}}
  if(key==="price"){
    const num=v=>v===""?null:Number(v);
    $("pMin").oninput=()=>{state.pMin=num($("pMin").value);update()};
    $("pMax").oninput=()=>{state.pMax=num($("pMax").value);update()};
    p.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const[a,z]=b.dataset.p.split("-");state.pMin=a?+a:null;state.pMax=z?+z:null;$("pMin").value=state.pMin??"";$("pMax").value=state.pMax??"";update()});
  }
  p.querySelector("[data-clear]").onclick=()=>{clearKey(key);closePanel();update()};
  p.querySelector("[data-close]").onclick=closePanel;
}
function clearKey(k){if(k==="price"){state.pMin=null;state.pMax=null}else state[k].clear()}

function renderActive(){
  const pills=[];
  ["brand","cat","size","color"].forEach(k=>state[k].forEach(v=>pills.push(`<button class="chip" type="button" data-k="${k}" data-v="${esc(v)}"><span>${LABELS[k]}</span>${esc(v)} <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.5"/></svg></button>`)));
  if(state.pMin!=null||state.pMax!=null)pills.push(`<button class="chip num" type="button" data-k="price"><span>Precio</span>${state.pMin!=null?fmt(state.pMin):"$0"} a ${state.pMax!=null?fmt(state.pMax):"sin tope"} <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.5"/></svg></button>`);
  if(pills.length>1)pills.push(`<button class="link quiet" type="button" id="clearAll">Quitar todos</button>`);
  $("active").innerHTML=pills.join("");
  $("active").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;k==="price"?clearKey("price"):state[k].delete(b.dataset.v);update()});
  $("clearAll")?.addEventListener("click",()=>{["brand","cat","size","color","price"].forEach(clearKey);update()});
  document.querySelectorAll(".dd").forEach(dd=>{const k=dd.dataset.key;dd.querySelector(".n").textContent=k==="price"?((state.pMin!=null||state.pMax!=null)?"1":""):(state[k].size||"")});
  $("tStock").classList.toggle("on",state.stock);$("tStock").setAttribute("aria-pressed",state.stock);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===state.tab));
}

function card(i){
  const disc=onSale(i)?Math.round((1-i.price/i.compare_at)*100):0;
  const pic=i.image?`<img src="${esc(i.image)}" alt="${esc(i.title)}" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'Foto no disponible'}))">`:`<span class="ph">Sin foto</span>`;
  const flags=[isNew(i)?`<span class="pill">Nuevo</span>`:"",i.available?"":`<span class="pill out">Agotado</span>`].join("");
  const sz=i.sizes.length?i.sizes.map(s=>`<span>${esc(s)}</span>`).join(""):`<span class="none">Sin tallas disponibles</span>`;
  const ig=STORES[i.brand]?.instagram;
  return `<article class="card"><a class="pic" href="${esc(i.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${pic}${flags?`<span class="flag">${flags}</span>`:""}</a>
  <div class="body"><div class="by"><span>${esc(i.brand)} · ${esc(i.cat)}</span>${ig?`<a href="${esc(ig)}" target="_blank" rel="noopener">Instagram</a>`:""}</div>
  <div class="title">${esc(i.title)}</div>
  <div class="price${disc?" sale":""}"><b>${fmt(i.price)}</b>${disc?`<s>${fmt(i.compare_at)}</s><span class="off">−${disc}%</span>`:""}</div>
  <div class="sizes">${sz}</div>
  <div class="go"><a href="${esc(i.url)}" target="_blank" rel="noopener"><span class="long">Ver en ${esc(i.brand)}</span><span class="short">Ver en la tienda</span> <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2L3 9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a></div></div></article>`;
}

function sorted(list){
  const d=i=>onSale(i)?1-i.price/i.compare_at:0;
  if(state.sort==="asc")return list.sort((a,b)=>a.price-b.price);
  if(state.sort==="desc")return list.sort((a,b)=>b.price-a.price);
  if(state.sort==="disc")return list.sort((a,b)=>d(b)-d(a));
  return list.sort((a,b)=>(b.published||"").localeCompare(a.published||""));
}

function update(resetPage=true){
  if(resetPage)shown=PAGE;
  // contadores de pestañas: con los filtros actuales, sin la pestaña
  const base=t=>{const keep=state.tab;state.tab=t;const n=DATA.items.filter(i=>matches(i)).length;state.tab=keep;return n};
  $("c-all").textContent=int(base("all"));$("c-sale").textContent=int(base("sale"));$("c-new").textContent=int(base("new"));
  const list=sorted(DATA.items.filter(i=>matches(i)));
  $("grid").innerHTML=list.length?list.slice(0,shown).map(card).join(""):`<div class="empty">Ninguna prenda calza con estos filtros. Quita alguno para ver más.</div>`;
  $("more").hidden=list.length<=shown;
  $("more").textContent=`Ver más prendas (${int(Math.min(shown,list.length))} de ${int(list.length)})`;
  $("count").textContent=`${int(list.length)} prenda${list.length===1?"":"s"}`;
  renderActive();
  if(openKey&&["brand","cat","color"].includes(openKey)){const c=counts(openKey);document.querySelectorAll(".panel .opt").forEach(l=>{const v=l.querySelector("input").value,n=c.get(v)||0;l.querySelector(".c").textContent=int(n);l.classList.toggle("zero",!n)})}
  save();
}

function renderStores(){
  const rows=DATA.stores.map(s=>{const its=DATA.items.filter(i=>i.brand===s.brand);return{...s,n:its.length,stock:its.filter(i=>i.available).length,sale:its.filter(onSale).length}}).sort((a,b)=>b.n-a.n||a.brand.localeCompare(b.brand,"es"));
  const empty=rows.filter(r=>!r.n).length;
  $("stores-sub").textContent=`${rows.length} marcas, ordenadas por cantidad de prendas.`+(empty?` ${empty===1?"Una tienda no tiene":empty+" tiendas no tienen"} prendas publicadas hoy.`:"");
  const z=n=>n?int(n):`<span class="zero">0</span>`;
  $("stores-table").querySelector("tbody").innerHTML=rows.map(r=>`<tr>
    <td class="name"><button type="button" data-brand="${esc(r.brand)}">${esc(r.brand)}</button></td>
    <td class="r">${z(r.n)}</td><td class="r opt-col">${z(r.stock)}</td><td class="r">${z(r.sale)}</td>
    <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\/(www\.)?/,""))}</a></td>
    <td class="opt-col">${r.instagram?`<a href="${esc(r.instagram)}" target="_blank" rel="noopener">@${esc(r.instagram.replace(/\/$/,"").split("/").pop())}</a>`:`<span class="dash">—</span>`}</td></tr>`).join("");
  $("stores-table").querySelectorAll("[data-brand]").forEach(b=>b.onclick=()=>{state.brand=new Set([b.dataset.brand]);state.tab="all";location.hash="";update();route()});
}

function route(){
  const v=location.hash==="#tiendas"?"stores":"catalog";
  $("v-catalog").hidden=v!=="catalog";$("v-stores").hidden=v!=="stores";
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title=v==="stores"?"Tiendas · Radar Streetwear CL":"Radar Streetwear CL";
  window.scrollTo(0,0);
}

function skeleton(){
  $("grid").innerHTML=Array.from({length:10},()=>`<div class="card skel" aria-hidden="true"><div class="pic"></div><div class="body"><div class="bar" style="width:60%"></div><div class="bar" style="width:90%;margin-top:6px"></div><div class="bar" style="width:40%;margin-top:6px"></div></div></div>`).join("");
}

document.querySelectorAll(".dd").forEach(dd=>dd.querySelector(".ctl").addEventListener("click",e=>{e.stopPropagation();openPanel(dd)}));
document.addEventListener("click",closePanel);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.tab=t.dataset.tab;update()});
$("q").oninput=()=>{state.q=$("q").value;update()};
$("tStock").onclick=()=>{state.stock=!state.stock;update()};
$("sort").onchange=()=>{state.sort=$("sort").value;update()};
$("more").onclick=()=>{shown+=PAGE;update(false)};
window.addEventListener("hashchange",route);
window.addEventListener("scroll",()=>$("top").classList.toggle("scrolled",scrollY>4),{passive:true});

function loadData(){
  skeleton();
  fetch("data.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
    DATA=d;STORES={};(d.stores||[]).forEach(s=>STORES[s.brand]=s);
    const items=d.items, brands=new Set(items.map(i=>i.brand)).size, sale=items.filter(i=>onSale(i)&&i.available).length, fresh=items.filter(isNew).length;
    $("finding").innerHTML=`<b>${int(items.length)}</b> prendas de <b>${brands}</b> marcas chilenas. <b>${int(sale)}</b> en oferta con stock`+(fresh?` y <b>${int(fresh)}</b> publicadas en los últimos ${NEW_DAYS} días.`:".");
    $("stamp").textContent=`Actualizado ${d.updated}`;
    $("sort").value=state.sort;
    update();renderStores();route();
  }).catch(()=>{
    $("finding").textContent="No se pudo cargar el catálogo.";
    $("grid").innerHTML=`<div class="empty">No se pudo cargar el catálogo. <button class="link" type="button" id="retry">Reintentar</button></div>`;
    $("retry").onclick=loadData;
  });
}
load();$("q").value=state.q;route();loadData();
</script>
</body>
</html>
