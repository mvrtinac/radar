<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Streetwear CL</title>
<meta name="description" content="Todo lo que publican las marcas chilenas de streetwear en un solo lugar: precios, ofertas y tallas, actualizado a diario.">
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="propuestas/core.css">
<style>
/* RADAR — negro de lookbook. Tres voces tipográficas:
   Arimo (grotesca ancha) para lo grande y las cifras · Instrument Serif cursiva para marcas y acentos · Archivo para leer.
   Escala con saltos fuertes: 25vw / 7vw / 56px / 24px / 15px / 12px. */
:root{
  --bg:#0b0b0b; --fg:#f2f2ee; --muted:#9a9a94; --dim:#7a7a74; --line:#2a2a28; --surface:#151514; --hover:#1f1f1d;
  --font:"Archivo",system-ui,sans-serif; --display:"Arimo","Helvetica Neue",Arial,sans-serif; --serif:"Instrument Serif",Georgia,serif;
  --radius-sm:0px; --max:1600px; --gut:20px; --focus:#f2f2ee;
  color-scheme:dark;
}
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
body.scrolled .top{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;height:54px;gap:28px}
.mark{font:700 20px/1 var(--display);letter-spacing:-.02em;text-decoration:none;text-transform:uppercase}
.mark em{font:italic 400 21px/1 var(--serif);text-transform:none;letter-spacing:0;margin-left:4px;color:var(--muted)}
.nav{display:flex;gap:22px;font:400 14px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.nav a{text-decoration:none;color:var(--muted);padding:6px 0;border-bottom:1px solid transparent}
.nav a[aria-current="page"]{color:var(--fg);border-color:var(--fg)}
.stamp{margin-left:auto;color:var(--muted);font-size:13px}

/* portada */
.hero{padding-top:18px}
.word{margin:0 0 0 -.045em;font:400 clamp(110px,25vw,420px)/.78 var(--display);letter-spacing:-.042em;text-transform:uppercase;white-space:nowrap}
.tagline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .3em;margin:.35em 0 0;font:400 clamp(26px,5.2vw,86px)/1 var(--display);text-transform:uppercase;letter-spacing:-.03em;color:var(--dim)}
.tagline i{font:italic 400 1.12em/1 var(--serif);text-transform:none;letter-spacing:-.01em;color:var(--fg)}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;margin-top:34px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.lead{margin:0;font-size:clamp(17px,1.5vw,21px);line-height:1.4;max-width:40ch}
.lead b{font-weight:600}
.lead i{font:italic 400 1.2em/1 var(--serif)}
.figs{display:flex;gap:40px}
.fig b{display:block;font:400 clamp(40px,4.4vw,68px)/.9 var(--display);letter-spacing:-.04em}
.fig span{display:block;margin-top:6px;font:italic 400 17px/1 var(--serif);color:var(--muted)}

/* cinta de marcas */
.ticker{overflow:hidden;border-bottom:1px solid var(--line);white-space:nowrap}
.ticker .run{display:inline-flex;gap:44px;padding:13px 0;animation:run 70s linear infinite;font:400 17px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.ticker .run i{font:italic 400 19px/1 var(--serif);color:var(--fg);margin-left:4px}
.ticker:hover .run{animation-play-state:paused}
@keyframes run{to{transform:translateX(-50%)}}

/* barra de pestañas y filtros */
.bar{position:sticky;top:54px;z-index:25;background:var(--bg);padding:16px 0 14px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:30px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:0;cursor:pointer;font:400 30px/1 var(--display);text-transform:uppercase;letter-spacing:-.03em;color:var(--dim);white-space:nowrap;transition:color .15s}
.tab .c{font:italic 400 18px/1 var(--serif);margin-left:6px;vertical-align:super;letter-spacing:0;text-transform:none}
.tab[aria-selected="true"]{color:var(--fg)}
.tab:hover{color:var(--fg)}
.search input{height:42px;padding:0 14px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.ctl{height:42px;padding:0 15px;background:transparent;border:1px solid var(--line);font:400 13px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;transition:border-color .15s,background .15s,color .15s}
.ctl:hover,.ctl[aria-expanded="true"]{border-color:var(--fg)}
.ctl .n{background:var(--fg);color:var(--bg);font:700 11px/18px var(--display);min-width:18px;height:18px;text-align:center;padding:0 5px}
.ctl.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.right{color:var(--muted);font-size:14px}
.right #count{font:italic 400 19px/1 var(--serif);color:var(--fg)}
.right select{height:42px;background:var(--surface);border:1px solid var(--line);padding:0 10px}
.active{margin-top:12px}
.chip{background:var(--surface);color:var(--fg)}
.presets button{border-color:var(--line)}

/* hoja de contactos */
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px;margin-top:2px;background:var(--line)}
.card{background:var(--bg)}
.pic{aspect-ratio:3/4;background:#161615}
.pic img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .pic img{transform:scale(1.045)}
.tag{position:absolute;top:10px;left:10px;display:flex;gap:4px;z-index:2}
.tag b{font:400 11px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;background:var(--bg);color:var(--fg)}
.off{position:absolute;top:10px;right:10px;z-index:2;background:var(--fg);color:var(--bg);font:700 15px/1 var(--display);letter-spacing:-.02em;padding:7px 8px}
.sz{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:rgba(11,11,11,.86);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.card:hover .sz,.card:focus-within .sz{transform:none}
.sz span{font:400 12px/1 var(--display);padding:5px 7px;border:1px solid #4a4a46}
.sz .none{border:0;color:var(--muted)}
.sz2{display:none}
.info{display:block;padding:14px 14px 18px;text-decoration:none}
.info .by{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.info .by em{font:italic 400 19px/1 var(--serif);color:var(--fg)}
.info .by span{font:400 11px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.info h3{margin:8px 0 12px;font:500 14px/1.35 var(--font);color:#cfcfca;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:38px}
.price{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.price b{font:400 26px/1 var(--display);letter-spacing:-.04em}
.price s{color:var(--muted);font-size:13px}
.go{margin-left:auto;font:400 12px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);transition:color .15s}
.card:hover .go{color:var(--fg)}
.empty{color:var(--muted);font:italic 400 22px/1.3 var(--serif)}
.skel .pic{background:#151514}
.more{height:50px;padding:0 28px;background:var(--fg);color:var(--bg);border:0;font:400 15px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;transition:opacity .15s}
.more:hover{opacity:.85}

/* tiendas */
.page-h{margin:22px 0 0 -.04em;font:400 clamp(80px,17vw,280px)/.8 var(--display);letter-spacing:-.055em;text-transform:uppercase}
.page-sub{margin:18px 0 32px;font:italic 400 clamp(20px,2vw,28px)/1.25 var(--serif);color:var(--muted)}
.table th{color:var(--muted);font:400 11px/1 var(--display);text-transform:uppercase;letter-spacing:.08em}
.table td{height:60px}
.table td.name button{font:italic 400 28px/1 var(--serif)}
.table td.r,.table th.r{padding-right:32px}
.table td.r{font:400 18px/1 var(--display);letter-spacing:-.02em}
.table a{font-size:14px}
.foot{margin:72px 0 0;padding:30px 0 44px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot b{font:700 15px/1 var(--display);letter-spacing:-.02em;color:var(--fg);text-transform:uppercase}

@media (max-width:760px){
  :root{--gut:14px}
  .stamp{display:none}
  .nav{margin-left:auto}
  .mark em{display:none}
  .word{font-size:27vw}
  .hero-row{grid-template-columns:1fr;gap:22px;margin-top:24px}
  .figs{gap:28px}
  .bar{position:static}
  .nav a{padding:14px 0}
  .tab{font-size:23px;padding:10px 0}
  .tabs{margin-bottom:8px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info{padding:10px 10px 14px}
  .info .by em{font-size:16px}
  .info .by span{display:none}
  .info h3{font-size:13px}
  .price b{font-size:21px}
  .go{display:none}
  .sz{display:none}
  .sz2{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .sz2 span{font:400 11px/1 var(--display);padding:4px 6px;border:1px solid #4a4a46;color:var(--fg)}
  .sz2 .none{border:0;padding:0;color:var(--muted)}
  .table td.name button{font-size:22px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#">Radar<em>streetwear</em></a>
  <nav class="nav" aria-label="Secciones"><a href="#" data-view="catalog">Catálogo</a><a href="#tiendas" data-view="stores">Tiendas</a></nav>
  <span class="stamp num" data-stamp></span>
</div></header>

<main>
<section id="v-catalog">
  <div class="wrap hero">
    <h1 class="word">Radar</h1>
    <p class="tagline">Streetwear chileno, <i>todo en un lugar</i></p>
    <div class="hero-row">
      <p class="lead" id="finding">Cargando las prendas de todas las tiendas…</p>
      <div class="figs num" id="figs"></div>
    </div>
  </div>
  <div class="ticker" aria-hidden="true"><div class="run" id="run"></div></div>

  <div class="bar"><div class="wrap">
    <div class="tabs" role="tablist" aria-label="Qué prendas mostrar">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">Todo<span class="c num" id="c-all"></span></button>
      <button class="tab" role="tab" data-tab="sale" aria-selected="false">Ofertas<span class="c num" id="c-sale"></span></button>
      <button class="tab" role="tab" data-tab="new" aria-selected="false">Recién llegado<span class="c num" id="c-new"></span></button>
    </div>
    <div class="tools">
      <label class="search"><input type="search" id="q" placeholder="Buscar prenda, marca o color" aria-label="Buscar" autocomplete="off"></label>
      <div class="filters">
        <div class="dd" data-key="brand"><button class="ctl" type="button" aria-expanded="false">Marca <span class="n num"></span></button></div>
        <div class="dd" data-key="cat"><button class="ctl" type="button" aria-expanded="false">Tipo <span class="n num"></span></button></div>
        <div class="dd" data-key="size"><button class="ctl" type="button" aria-expanded="false">Talla <span class="n num"></span></button></div>
        <div class="dd" data-key="color"><button class="ctl" type="button" aria-expanded="false">Color <span class="n num"></span></button></div>
        <div class="dd" data-key="price"><button class="ctl" type="button" aria-expanded="false">Precio <span class="n num"></span></button></div>
        <button class="ctl" type="button" id="tStock" aria-pressed="true">Con stock</button>
      </div>
      <div class="right"><span class="num" id="count"></span>
        <select id="sort" aria-label="Ordenar"><option value="rel">Más recientes</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option><option value="disc">Mayor descuento</option></select>
      </div>
    </div>
    <div class="active" id="active"></div>
  </div></div>

  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="wrap"><button class="more num" id="more" type="button" hidden></button></div>
</section>

<section id="v-stores" class="wrap" hidden>
  <h1 class="page-h">Tiendas</h1>
  <p class="page-sub num" id="stores-sub"></p>
  <div style="overflow-x:auto"><table class="table" id="stores-table"><thead><tr><th>Marca</th><th class="r">Prendas</th><th class="r opt-col">Con stock</th><th class="r">En oferta</th><th>Tienda</th><th class="opt-col">Instagram</th></tr></thead><tbody></tbody></table></div>
</section>

<footer class="wrap foot"><span><b>Radar</b> · Precios y stock de la web pública de cada tienda. La compra se hace en la tienda original.</span><span data-stamp></span></footer>
</main>

<script>
window.RADAR={id:"main",data:"data.json",
  finding(s,h){
    document.getElementById("finding").innerHTML=`Lo que están publicando las marcas chilenas, con su precio de hoy y el link directo para comprar. <i>Hoy hay</i> <b>${h.int(s.sale)} prendas en oferta.</b>`;
    document.getElementById("figs").innerHTML=`<div class="fig"><b>${h.int(s.items)}</b><span>prendas</span></div><div class="fig"><b>${s.brands}</b><span>marcas</span></div>`+(s.fresh?`<div class="fig"><b>${h.int(s.fresh)}</b><span>nuevas esta quincena</span></div>`:"");
  },
  ticker(d,h){
    const c={};d.items.forEach(i=>c[i.brand]=(c[i.brand]||0)+1);
    const row=d.stores.filter(s=>c[s.brand]).map(s=>`<span>${h.esc(s.brand)}<i>${c[s.brand]}</i></span>`).join("");
    document.getElementById("run").innerHTML=row+row;
  },
  card(i,h){
    const d=h.disc(i);
    const tags=[h.isNew(i)?`<b>Nuevo</b>`:"",!i.available?`<b>Agotado</b>`:""].join("");
    return `<article class="card">
      <a class="pic" href="${h.esc(i.url)}" target="_blank" rel="noopener noreferrer" tabindex="-1">${h.pic(i)}${tags?`<span class="tag">${tags}</span>`:""}${d?`<span class="off">−${d}%</span>`:""}<span class="sz">${h.sizes(i)}</span></a>
      <a class="info" href="${h.esc(i.url)}" target="_blank" rel="noopener noreferrer">
        <span class="by"><em>${h.esc(i.brand)}</em><span>${h.esc(i.cat)}</span></span>
        <h3>${h.esc(i.title)}</h3>
        <span class="price"><b>${h.fmt(i.price)}</b>${d?`<s>${h.fmt(i.compare_at)}</s>`:""}<span class="go">Comprar ↗</span></span>
        <span class="sz2">${h.sizes(i)}</span>
      </a></article>`;
  }};
</script>
<script src="propuestas/core.js"></script>
</body>
</html>
